# Kizuna for iOS/iPadOS - builds an unsigned IPA on a macOS runner.
# SPDX-License-Identifier: AGPL-3.0-only
#
# Result: artifact "Kizuna-unsigned-ipa" (Kizuna-unsigned.ipa). Sign/sideload
# it with SideStore, AltStore or Sideloadly (see ios/README-ro.md).
#
# Diagnostics: every compiler/CMake error is also published as a check-run
# annotation and in the job summary, so a failed build can be analysed
# without downloading the logs.

name: iOS (IPA nesemnat)

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # publish the "latest" release + AltStore source on main

jobs:
  build:
    name: Build Kizuna.ipa
    runs-on: macos-26
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
        working-directory: ios

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_26.6.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          else
            echo "::warning::Xcode 26.6 not found on this image, using the newest Xcode 26.x"
            ls -d /Applications/Xcode_26*.app
            newest="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n1)"
            sudo xcode-select -s "$newest/Contents/Developer"
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Set up Python (nanopb generator)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          brew install xcodegen protobuf ninja || brew upgrade xcodegen protobuf ninja || true
          command -v cmake >/dev/null || brew install cmake
          cmake --version | head -n1
          protoc --version
          xcodegen --version

      - name: Cache native core
        id: core-cache
        uses: actions/cache@v4
        with:
          path: |
            ios/Vendor/lib
            ios/Vendor/include
            ios/Vendor/VERSION
          key: kizuna-core-${{ runner.os }}-xcode26-${{ hashFiles('ios/Core/**', 'ios/scripts/build-core.sh', 'ios/scripts/patch_chiaki.py') }}

      # Keeps going on failure so the Swift sources are still compiled (and their
      # errors reported) in the same run; the app link then fails without the core.
      - name: Build native core (chiaki-ng + shim)
        id: core
        if: steps.core-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p build
          bash ./scripts/build-core.sh 2>&1 | tee build/build-core.log

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (unsigned)
        id: app
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project Kizuna.xcodeproj \
            -scheme Kizuna \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            build > build/xcodebuild.log 2>&1 || true
          grep -E '(: error:|BUILD (SUCCEEDED|FAILED))' build/xcodebuild.log | head -n 200 || true
          app=build/DerivedData/Build/Products/Release-iphoneos/Kizuna.app
          # The .app folder exists even when compilation fails (assets are
          # processed first), so require the linked executable itself.
          if ! grep -q '\*\* BUILD SUCCEEDED \*\*' build/xcodebuild.log || [ ! -x "$app/Kizuna" ]; then
            echo "::error title=Kizuna app::xcodebuild did not produce the Kizuna executable (see Report errors)"
            exit 1
          fi
          size=$(du -k "$app/Kizuna" | cut -f1)
          archs=$(lipo -archs "$app/Kizuna")
          echo "::notice title=Kizuna binary::Kizuna executable ${size} KB (${archs}); takion strings: $(strings -a "$app/Kizuna" 2>/dev/null | grep -ci takion || true)"

      - name: Package IPA
        run: |
          set -euo pipefail
          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/Kizuna.app build/ipa/Payload/
          (cd build/ipa && zip -qry ../Kizuna-unsigned.ipa Payload)
          ls -lh build/Kizuna-unsigned.ipa
          echo "::notice title=Kizuna IPA::Kizuna-unsigned.ipa $(du -k build/Kizuna-unsigned.ipa | cut -f1) KB"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Kizuna-unsigned-ipa
          path: ios/build/Kizuna-unsigned.ipa
          if-no-files-found: error

      # Public download for the phone (artifacts need a GitHub login) and an AltStore
      # Classic source: add https://raw.githubusercontent.com/<owner>/<repo>/main/altstore/source.json
      # once in AltStore > Sources, then install/update Kizuna from AltStore itself.
      - name: Publish latest release + AltStore source
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp build/Kizuna-unsigned.ipa build/Kizuna.ipa
          repo="${GITHUB_REPOSITORY}"
          if gh release view latest --repo "$repo" >/dev/null 2>&1; then
            gh release upload latest build/Kizuna.ipa --repo "$repo" --clobber
            gh release edit latest --repo "$repo" --title "Kizuna (build ${GITHUB_RUN_NUMBER})" --prerelease
          else
            gh release create latest build/Kizuna.ipa --repo "$repo" --prerelease               --title "Kizuna (build ${GITHUB_RUN_NUMBER})"               --notes "IPA nesemnat pentru AltStore / SideStore / Sideloadly. Se actualizează la fiecare build."
          fi
          size=$(stat -f%z build/Kizuna.ipa)
          # SideStore / AltStore refuse an install when the source's buildVersion differs from
          # the IPA's CFBundleVersion, so both numbers come from the app that was built.
          plist=build/ipa/Payload/Kizuna.app/Info.plist
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")
          build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")
          echo "::notice title=Kizuna version::${version} (build ${build})"
          mkdir -p ../altstore
          python3 - "$repo" "$version" "$build" "$size" <<'PY'
          import json, sys, datetime
          repo, version, build, size = sys.argv[1], sys.argv[2], sys.argv[3], int(sys.argv[4])
          raw = f"https://raw.githubusercontent.com/{repo}/main"
          source = {
              "name": "Kizuna",
              "identifier": "ro.kizuna.source",
              "subtitle": "PS5 Remote Play pentru iPhone și iPad",
              "website": f"https://github.com/{repo}",
              "iconURL": f"{raw}/ios/Kizuna/Assets.xcassets/AppIcon.appiconset/icon_1024.png",
              "apps": [{
                  "name": "Kizuna",
                  "bundleIdentifier": "ro.kizuna.remoteplay",
                  "developerName": "Kizuna",
                  "subtitle": "PS5 / PS4 Remote Play",
                  "localizedDescription": "Client PS5 și PS4 Remote Play bazat pe chiaki-ng, cu interfață Liquid Glass. Licență AGPL-3.0.",
                  "iconURL": f"{raw}/ios/Kizuna/Assets.xcassets/AppIcon.appiconset/icon_1024.png",
                  "tintColor": "0070D1",
                  "category": "games",
                  "versions": [{
                      "version": version,
                      "buildVersion": build,
                      "date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                      "localizedDescription": f"Build {build}",
                      "downloadURL": f"https://github.com/{repo}/releases/download/latest/Kizuna.ipa",
                      "size": size,
                      "minOSVersion": "17.0",
                  }],
                  "appPermissions": {
                      "entitlements": [],
                      "privacy": {
                          "NSLocalNetworkUsageDescription": "Găsește și conectează consola PlayStation din rețeaua locală.",
                      },
                  },
              }],
              "news": [],
          }
          json.dump(source, open("../altstore/source.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          PY
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add altstore/source.json
          if ! git diff --cached --quiet; then
            git commit -m "AltStore source: build ${GITHUB_RUN_NUMBER} [skip ci]"
            git pull --rebase --autostash origin main || true
            git push origin HEAD:main
          fi

      - name: Report errors
        if: always()
        run: |
          python3 - <<'PY'
          import os, re

          def grab(path, patterns, context_after=0):
              if not os.path.exists(path):
                  return []
              lines = open(path, encoding="utf-8", errors="replace").read().splitlines()
              out, seen = [], set()
              for i, line in enumerate(lines):
                  if any(re.search(p, line) for p in patterns):
                      block = [line] + lines[i + 1:i + 1 + context_after]
                      key = line.strip()
                      if key in seen:
                          continue
                      seen.add(key)
                      out.extend(l.rstrip() for l in block)
              return out

          core = grab("build/build-core.log",
                      [r"CMake Error", r"\berror:", r"FAILED:", r"fatal error", r"Undefined symbols",
                       r"No such file", r"command not found", r"^ERROR", r"Traceback"],
                      context_after=4)
          app = grab("build/xcodebuild.log",
                     [r": error:", r"^ld: ", r"Undefined symbol", r"error: ", r"\*\* BUILD FAILED \*\*",
                      r"The following build commands failed"],
                     context_after=1)

          def strip_paths(s):
              return re.sub(r"/Users/runner/work/[^/]+/[^/]+/", "", s)

          sections = [("native core", core), ("app", app)]
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          with open(summary, "a", encoding="utf-8") as fh:
              for name, items in sections:
                  fh.write(f"### Errors: {name} ({len(items)} lines)\n\n```\n")
                  fh.write("\n".join(strip_paths(x) for x in items[:600]) or "(none)")
                  fh.write("\n```\n\n")

          # Annotations are public through the checks API (max 10 errors per step).
          budget = 10
          for name, items in sections:
              text = [strip_paths(x)[:400] for x in items]
              chunk, size = [], 0
              chunks = []
              for line in text:
                  if size + len(line) > 3500 and chunk:
                      chunks.append(chunk)
                      chunk, size = [], 0
                  chunk.append(line)
                  size += len(line) + 1
              if chunk:
                  chunks.append(chunk)
              for n, c in enumerate(chunks, 1):
                  if budget == 0:
                      break
                  msg = "\n".join(c).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print(f"::error title=Kizuna {name} {n}/{len(chunks)}::{msg}")
                  budget -= 1
          PY

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kizuna-build-logs
          path: |
            ios/build/xcodebuild.log
            ios/build/build-core.log
          if-no-files-found: ignore
