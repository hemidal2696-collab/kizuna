# Kizuna for iOS/iPadOS - builds an unsigned IPA on a macOS runner.
# SPDX-License-Identifier: AGPL-3.0-only
#
# Result: artifact "Kizuna-unsigned-ipa" (Kizuna-unsigned.ipa). Sign/sideload
# it with SideStore, AltStore or Sideloadly (see ios/README-ro.md).
#
# Diagnostics: every compiler/CMake error is also published as a check-run
# annotation and in the job summary, so a failed build can be analysed
# without downloading the logs.

name: iOS (IPA nesemnat)

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Kizuna.ipa
    runs-on: macos-26
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
        working-directory: ios

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_26.6.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          else
            echo "::warning::Xcode 26.6 not found on this image, using the newest Xcode 26.x"
            ls -d /Applications/Xcode_26*.app
            newest="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n1)"
            sudo xcode-select -s "$newest/Contents/Developer"
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Set up Python (nanopb generator)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          brew install xcodegen protobuf ninja || brew upgrade xcodegen protobuf ninja || true
          command -v cmake >/dev/null || brew install cmake
          cmake --version | head -n1
          protoc --version
          xcodegen --version

      - name: Cache native core
        id: core-cache
        uses: actions/cache@v4
        with:
          path: |
            ios/Vendor/lib
            ios/Vendor/include
            ios/Vendor/VERSION
          key: kizuna-core-${{ runner.os }}-xcode26-${{ hashFiles('ios/Core/**', 'ios/scripts/build-core.sh', 'ios/scripts/patch_chiaki.py') }}

      # Keeps going on failure so the Swift sources are still compiled (and their
      # errors reported) in the same run; the app link then fails without the core.
      - name: Build native core (chiaki-ng + shim)
        id: core
        if: steps.core-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p build
          bash ./scripts/build-core.sh 2>&1 | tee build/build-core.log

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (unsigned)
        id: app
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project Kizuna.xcodeproj \
            -scheme Kizuna \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build/xcodebuild.log 2>&1 || true
          grep -E '(: error:|BUILD (SUCCEEDED|FAILED))' build/xcodebuild.log | head -n 200 || true
          app=build/DerivedData/Build/Products/Release-iphoneos/Kizuna.app
          # The .app folder exists even when compilation fails (assets are
          # processed first), so require the linked executable itself.
          if ! grep -q '\*\* BUILD SUCCEEDED \*\*' build/xcodebuild.log || [ ! -x "$app/Kizuna" ]; then
            echo "::error title=Kizuna app::xcodebuild did not produce the Kizuna executable (see Report errors)"
            exit 1
          fi
          size=$(du -k "$app/Kizuna" | cut -f1)
          archs=$(lipo -archs "$app/Kizuna")
          echo "::notice title=Kizuna binary::Kizuna executable ${size} KB (${archs}); takion strings: $(strings -a "$app/Kizuna" 2>/dev/null | grep -ci takion || true)"

      - name: Package IPA
        run: |
          set -euo pipefail
          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/Kizuna.app build/ipa/Payload/
          (cd build/ipa && zip -qry ../Kizuna-unsigned.ipa Payload)
          ls -lh build/Kizuna-unsigned.ipa
          echo "::notice title=Kizuna IPA::Kizuna-unsigned.ipa $(du -k build/Kizuna-unsigned.ipa | cut -f1) KB"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Kizuna-unsigned-ipa
          path: ios/build/Kizuna-unsigned.ipa
          if-no-files-found: error

      - name: Report errors
        if: always()
        run: |
          python3 - <<'PY'
          import os, re

          def grab(path, patterns, context_after=0):
              if not os.path.exists(path):
                  return []
              lines = open(path, encoding="utf-8", errors="replace").read().splitlines()
              out, seen = [], set()
              for i, line in enumerate(lines):
                  if any(re.search(p, line) for p in patterns):
                      block = [line] + lines[i + 1:i + 1 + context_after]
                      key = line.strip()
                      if key in seen:
                          continue
                      seen.add(key)
                      out.extend(l.rstrip() for l in block)
              return out

          core = grab("build/build-core.log",
                      [r"CMake Error", r"\berror:", r"FAILED:", r"fatal error", r"Undefined symbols",
                       r"No such file", r"command not found", r"^ERROR", r"Traceback"],
                      context_after=4)
          app = grab("build/xcodebuild.log",
                     [r": error:", r"^ld: ", r"Undefined symbol", r"error: ", r"\*\* BUILD FAILED \*\*",
                      r"The following build commands failed"],
                     context_after=1)

          def strip_paths(s):
              return re.sub(r"/Users/runner/work/[^/]+/[^/]+/", "", s)

          sections = [("native core", core), ("app", app)]
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          with open(summary, "a", encoding="utf-8") as fh:
              for name, items in sections:
                  fh.write(f"### Errors: {name} ({len(items)} lines)\n\n```\n")
                  fh.write("\n".join(strip_paths(x) for x in items[:600]) or "(none)")
                  fh.write("\n```\n\n")

          # Annotations are public through the checks API (max 10 errors per step).
          budget = 10
          for name, items in sections:
              text = [strip_paths(x)[:400] for x in items]
              chunk, size = [], 0
              chunks = []
              for line in text:
                  if size + len(line) > 3500 and chunk:
                      chunks.append(chunk)
                      chunk, size = [], 0
                  chunk.append(line)
                  size += len(line) + 1
              if chunk:
                  chunks.append(chunk)
              for n, c in enumerate(chunks, 1):
                  if budget == 0:
                      break
                  msg = "\n".join(c).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print(f"::error title=Kizuna {name} {n}/{len(chunks)}::{msg}")
                  budget -= 1
          PY

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kizuna-build-logs
          path: |
            ios/build/xcodebuild.log
            ios/build/build-core.log
          if-no-files-found: ignore
