# Kizuna for iOS/iPadOS - XcodeGen spec (https://github.com/yonaskolb/XcodeGen)
# SPDX-License-Identifier: AGPL-3.0-only
#
#   bash scripts/build-core.sh   # builds Vendor/lib/libKizunaCore.a first
#   xcodegen generate            # writes Kizuna.xcodeproj
#
# The native core is a prebuilt static library: Core/ is NOT compiled by Xcode.

name: Kizuna

options:
  bundleIdPrefix: ro.kizuna
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: false
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_BITCODE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal
    CLANG_ENABLE_MODULES: YES

targets:
  Kizuna:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Kizuna
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_NAME: Kizuna
        PRODUCT_BUNDLE_IDENTIFIER: ro.kizuna.remoteplay
        INFOPLIST_FILE: Kizuna/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ARCHS: arm64
        SWIFT_OBJC_BRIDGING_HEADER: Kizuna/Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/Core"
          - "$(SRCROOT)/Vendor/include"
        LIBRARY_SEARCH_PATHS:
          - "$(SRCROOT)/Vendor/lib"
        OTHER_LDFLAGS:
          - "-lKizunaCore"
          - "-lc++"
          - "-lz"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        DEAD_CODE_STRIPPING: YES
        SWIFT_EMIT_LOC_STRINGS: NO
    dependencies:
      - sdk: VideoToolbox.framework
      - sdk: AudioToolbox.framework
      - sdk: AVFAudio.framework
      - sdk: AVFoundation.framework
      - sdk: CoreMedia.framework
      - sdk: GameController.framework
      - sdk: CoreHaptics.framework
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: CoreFoundation.framework
      - sdk: Network.framework
      - sdk: WebKit.framework
      - sdk: Metal.framework

schemes:
  Kizuna:
    build:
      targets:
        Kizuna: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
